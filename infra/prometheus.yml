global:
  scrape_interval: 15s  # poll every service every 15 seconds

scrape_configs:
  - job_name: "api-server"
    static_configs:
      - targets: ["api-server:8000"]  # FastAPI /metrics endpoint (added in next step)

  - job_name: "gameserver"
    static_configs:
      - targets: ["gameserver:9002"]  # C++ /metrics endpoint on a separate port from WS (added in next step)
