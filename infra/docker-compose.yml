
# running the service 
# docker compose --env-file infra/.env -f infra/docker-compose.yml up -d
# docker compose --env-file infra/.env -f infra/docker-compose.yml down (docker compose down also works) 
# docker compose --env-file infra/.env -f infra/docker-compose.yml build
#
# If there is ever a migration for a database or anything here is the command for that
# (make sure the postgres server is up and running)
# docker compose -f infra/docker-compose.yml exec -T postgres psql -U <user> -d <db> < infra/migrations/[filemigration.sql]

services:
  client:
    build: ../frontend/
    ports:
      - "3000:3000"
  api-server:
    build: ../services/api/
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINS: 15
      REFRESH_TOKEN_DAYS: 7
      WS_BASE_URL: ws://localhost:9001
    depends_on:
      - postgres
      - redis
  gameserver:
    build:
      context: ../
      dockerfile: services/gameserver/Dockerfile
    ports:
      - "9001:9001"
    environment:
      GRPC_ADDRESS: api-server:50051
    depends_on:
      - api-server
  postgres:
    image: postgres:16-alpine
    container_name: secure_chess_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: secure_chess_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  prometheus:
    image: prom/prometheus:latest
    container_name: secure_chess_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro  # mount our config as read-only
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
  grafana:
    image: grafana/grafana:latest
    container_name: secure_chess_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3001:3000"  # 3000 is taken by the frontend
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
